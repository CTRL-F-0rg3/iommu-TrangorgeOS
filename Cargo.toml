[package]
name = "iommu-driver"
version = "0.7.2"
edition = "2024"
license = "MIT"
repository = "https://github.com/MicroPerceptron/iommu"
description = "IOMMU (DMA remapping) driver for TrangorgeOS, built on the kore iommu hardware core"

[lib]
name = "iommu_driver"
path = "src/lib.rs"

[[bin]]
name = "iommu-driver"
path = "src/main.rs"
# The driver binary is `no_main` and provides its own `#[panic_handler]`, so
# Cargo must not try to build a test harness for it. Unit tests live in the
# library target instead.
test = false
bench = false

[dependencies]
# ── TrangorgeOS driver-space infrastructure (lib/) ──────────────────
# `lib/` only - a driver must never depend on `crates/` (the one-way
# dependency rule from Workspace.md).
kapi-abi = { path = "../../lib/kapi-abi" }
kapi-syscall = { path = "../../lib/kapi-syscall" }
ds-log = { path = "../../lib/ds-log" }
ds-fw-iommu = { path = "../../lib/ds-fw-iommu" }

# ── Hardware core (upstream `kore` lineage) ─────────────────────────
heapless = { version = "0.9.2", default-features = false }
memory_addr = { version = "0.4.1", default-features = false }
acpi = { version = "6.1.1", default-features = false }
kore-memory = { git = "https://github.com/MicroPerceptron/kore-memory.git", rev = "e03cdb79d665724d023401b8270d8ba419471372", default-features = false }

[target.'cfg(target_arch = "x86_64")'.dependencies]
x86_64 = { version = "0.15.4", default-features = false }

